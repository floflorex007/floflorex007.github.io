<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetLab – Idées boutique</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #e6e8ee; font-family: system-ui, sans-serif; padding: 24px 16px 110px; }
h1 { font-size: 26px; margin-bottom: 6px; }
.sub { color: #858a98; margin-bottom: 10px; max-width: 820px; }
h2 { font-size: 18px; margin: 30px 0 14px; display: flex; align-items: center; gap: 10px; }
h2 .price { background: rgba(245, 196, 81, .12); color: #f5c451; border: 1px solid rgba(245, 196, 81, .4); font-size: 13px; padding: 3px 10px; border-radius: 999px; }
button { font: inherit; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.item { background: linear-gradient(180deg, #1c202c 0%, #14161e 100%); border: 1px solid #2c3040; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color .2s; }
.item.selected { border-color: #f5c451; box-shadow: 0 0 0 1px #f5c451; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.item-head h3 { font-size: 15px; }
.item-head .pts { color: #f5c451; font-weight: 800; font-size: 13px; white-space: nowrap; }
.desc { color: #aaaeba; font-size: 13px; }
.stage { background: #0f1117; border-radius: 12px; padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid #2c3040; background: #1c202c; color: #c4c8d4; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; }
.opt.on { border-color: #6c63ff; background: rgba(108, 99, 255, .2); color: white; }
.foot { display: flex; justify-content: space-between; align-items: center; }
.pick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaaeba; cursor: pointer; }
.pick input { width: 16px; height: 16px; accent-color: #f5c451; }
.play { border: none; background: #292d3b; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

/* Ligne de classement factice */
.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px; position: relative; }
.row .rank { color: #737887; font-weight: 700; width: 14px; font-size: 12px; }
.row .name { flex: 1; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .bal { color: #6c63ff; font-weight: 800; }
.row.dim { opacity: .45; }

/* 20 pts */
.emoji-badge { font-size: 15px; animation: pop .4s; }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } }
.neon { color: var(--c); text-shadow: 0 0 6px var(--c), 0 0 14px var(--c); }
.title-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 999px; background: rgba(108, 99, 255, .18); color: #a59fff; border: 1px solid rgba(108, 99, 255, .4); }
.bet-mini { border: 1px solid #2c3040; border-radius: 12px; padding: 10px 12px; font-size: 13px; background: #1c202c; }
.bet-mini .author { font-size: 11px; color: #858a98; margin-bottom: 4px; }
.stamp { display: inline-block; margin-left: 6px; font-size: 14px; }
.confetti { position: absolute; top: -10px; width: 7px; height: 10px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(150px) rotate(600deg); } }

/* 50 pts */
.metal { background: var(--g); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; animation: shine 2.5s linear infinite; }
@keyframes shine { from { background-position: 200% 0; } to { background-position: 0 0; } }
.aura { background: rgba(108, 99, 255, .08); }
.aura::before { content: ""; position: absolute; inset: -2px; border-radius: 12px; padding: 2px; background: conic-gradient(from var(--a), #6c63ff, #c86bff, #3aa0ff, #6c63ff); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 3s linear infinite; }
@property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --a: 360deg; } }
.sparkle { position: absolute; font-size: 10px; pointer-events: none; animation: sparkle 1.6s ease-in-out infinite; }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
.theme-card { border-radius: 12px; padding: 12px; font-size: 13px; border: 1px solid #2c3040; }
.theme-galaxie { background: radial-gradient(circle at 20% 30%, #3b2a7a 0, transparent 40%), radial-gradient(circle at 80% 70%, #1d4b7a 0, transparent 45%), #0d0b1d; border-color: #4b3fa0; }
.theme-carbone { background: repeating-linear-gradient(45deg, #1a1c22 0 6px, #14161b 6px 12px); border-color: #3a3d48; }
.theme-sunset { background: linear-gradient(135deg, #3d1f3a, #6b2f2f 55%, #7a4a1d); border-color: #a0563a; }
.firework { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: boom .9s ease-out forwards; }
@keyframes boom { to { transform: translate(var(--x), var(--y)); opacity: 0; } }
.trail-name { position: relative; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: #171a23; border-top: 1px solid #2c3040; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar strong { color: #f5c451; }
.copy { background: #f5c451; color: #111; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>

<h1>Idées pour la boutique</h1>
<p class="sub">Uniquement de l'esthétique. Chaque idée a un aperçu en direct (dans une ligne du classement ou une carte de pari). Certaines ont des variantes à choisir : clique dessus. Coche celles que tu veux garder.</p>

<h2>Petits plaisirs <span class="price">20 pts</span></h2>
<div class="grid" id="g20"></div>

<h2>Effets premium <span class="price">50 pts</span></h2>
<div class="grid" id="g50"></div>

<div class="bar">
    <span><strong id="count">0</strong> idée(s) cochée(s)</span>
    <button class="copy" id="copy">Copier ma sélection</button>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const row = (name, extra = "", cls = "") => `
    <div class="row dim"><span class="rank">2</span><span class="name">Emma</span><span class="bal">1 840 €</span></div>
    <div class="row ${cls}" data-me><span class="rank">3</span><span class="name">${name}${extra}</span><span class="bal">1 520 €</span></div>`;

const ITEMS = [
    /* ---------- 20 pts ---------- */
    { g: 20, id: "emoji", title: "Emoji à côté du pseudo", desc: "Un petit emoji à côté de ton pseudo, partout sur le site. 24 h.",
      opts: ["🔥", "⚡", "🍀", "🦊", "💎", "🎯"],
      render: o => row("Toi", `<span class="emoji-badge">${o}</span>`) },

    { g: 20, id: "neon", title: "Pseudo néon", desc: "Ton pseudo brille d'une couleur néon unie. 24 h.",
      opts: ["#ff4d9d", "#4dd2ff", "#63ff9a", "#ffd24d"], optLabel: c => `<span style="color:${c}">●</span>`,
      render: o => row(`<span class="neon" style="--c:${o}">Toi</span>`) },

    { g: 20, id: "titre", title: "Titre sous le pseudo", desc: "Un petit titre affiché à côté de ton pseudo dans le classement. 7 jours.",
      opts: ["Le Prophète", "Chanceux", "Outsider", "Requin", "Débutant"],
      render: o => row("Toi", `<span class="title-tag">${o}</span>`) },

    { g: 20, id: "tampon", title: "Tampon sur tes paris créés", desc: "Un tampon s'affiche sur les cartes des paris que tu crées. 7 jours.",
      opts: ["🔥", "👀", "🎲", "🍿", "😈"],
      render: o => `<div class="bet-mini"><div class="author">🏆 Créé par Toi<span class="stamp">${o}</span></div>Thomas arrivera-t-il en retard demain ?</div>` },

    { g: 20, id: "confettis", title: "Confettis à ta couleur", desc: "Quand tu gagnes, les confettis prennent tes couleurs. 7 jours.",
      opts: ["Or", "Rose", "Océan", "Forêt"], play: true,
      palettes: { "Or": ["#f5c451", "#ffe69a", "#b88a1d"], "Rose": ["#ff4d9d", "#ffb3d1", "#c86bff"], "Océan": ["#3aa0ff", "#4dd2ff", "#a7e9ff"], "Forêt": ["#63d69f", "#2f8f5b", "#c8f5dc"] },
      render: o => `<div style="text-align:center;font-weight:800">🎉 Pari gagné !</div><div style="text-align:center;font-size:12px;color:#858a98">Clique sur « Voir l'effet »</div>` },

    /* ---------- 50 pts ---------- */
    { g: 50, id: "metal", title: "Pseudo métallique", desc: "Ton pseudo prend un reflet métal qui brille en continu. 7 jours.",
      opts: ["Or", "Argent", "Bronze", "Rose gold"],
      grads: { "Or": "linear-gradient(90deg,#b88a1d,#ffe69a,#f5c451,#b88a1d)", "Argent": "linear-gradient(90deg,#8a8f9c,#ffffff,#c4c8d4,#8a8f9c)", "Bronze": "linear-gradient(90deg,#7a4a1d,#e0a46a,#b8733a,#7a4a1d)", "Rose gold": "linear-gradient(90deg,#b76e79,#ffd6dc,#e8a0a8,#b76e79)" },
      render: (o, it) => row(`<span class="metal" style="--g:${it.grads[o]}">Toi</span>`) },

    { g: 50, id: "aura", title: "Aura animée", desc: "Un contour lumineux tourne autour de ta ligne du classement. 7 jours.",
      render: () => row("Toi", "", "aura") },

    { g: 50, id: "etincelles", title: "Pseudo étincelant", desc: "De petites étoiles scintillent autour de ton pseudo. 7 jours.",
      render: () => row(`<span class="trail-name">Toi${[[-8, -6], [26, -8], [36, 8], [-6, 10]].map(([x, y], i) => `<span class="sparkle" style="left:${x}px;top:${y}px;animation-delay:${i * .4}s">✦</span>`).join("")}</span>`) },

    { g: 50, id: "theme", title: "Thème de carte pour tes paris", desc: "Les paris que tu crées ont un fond spécial, visible par tout le monde. 7 jours.",
      opts: ["galaxie", "carbone", "sunset"], optLabel: t => t.charAt(0).toUpperCase() + t.slice(1),
      render: o => `<div class="theme-card theme-${o}"><div style="font-size:11px;color:#c4c8d4;margin-bottom:4px">🏆 Créé par Toi</div>Qui gagne le match ce soir ?</div>` },

    { g: 50, id: "victoire", title: "Victoire feu d'artifice", desc: "Quand tu gagnes un pari, un feu d'artifice à la place des confettis. 7 jours.", play: true,
      render: () => `<div style="text-align:center;font-weight:800">🎆 Pari gagné !</div><div style="text-align:center;font-size:12px;color:#858a98">Clique sur « Voir l'effet »</div>` }
];

ITEMS.forEach(it => {
    const el = document.createElement("div");
    el.className = "item";
    let current = it.opts ? it.opts[0] : null;
    el.innerHTML = `
        <div class="item-head"><h3>${it.title}</h3><span class="pts">${it.g} pts</span></div>
        <p class="desc">${it.desc}</p>
        <div class="stage"></div>
        ${it.opts ? `<div class="opts">${it.opts.map((o, i) => `<button class="opt${i === 0 ? " on" : ""}" data-o="${o}">${it.optLabel ? it.optLabel(o) : o}</button>`).join("")}</div>` : ""}
        <div class="foot"><label class="pick"><input type="checkbox" value="${it.title} (${it.g} pts)"> Je garde</label>${it.play ? `<button class="play">▶ Voir l'effet</button>` : ""}</div>`;
    const stage = $(".stage", el);
    const draw = () => { stage.innerHTML = it.render(current, it); };
    draw();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        current = b.dataset.o; el.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b)); draw();
    }));
    if (it.play) $(".play", el).addEventListener("click", () => {
        if (it.id === "confettis") {
            const pal = it.palettes[current];
            for (let i = 0; i < 50; i++) { const c = document.createElement("div"); c.className = "confetti"; c.style.cssText = `left:${Math.random() * 100}%;background:${pal[i % 3]};animation-duration:${.9 + Math.random()}s;animation-delay:${Math.random() * .3}s`; stage.appendChild(c); setTimeout(() => c.remove(), 2200); }
        } else {
            const cols = ["#f5c451", "#ff4d9d", "#4dd2ff", "#63ff9a", "#c86bff"];
            [[30, 40], [70, 30], [50, 60]].forEach(([cx, cy], k) => setTimeout(() => {
                for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2, d = 30 + Math.random() * 20; const p = document.createElement("div"); p.className = "firework"; p.style.cssText = `left:${cx}%;top:${cy}%;background:${cols[(i + k) % 5]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px`; stage.appendChild(p); setTimeout(() => p.remove(), 1000); }
            }, k * 250));
        }
    });
    $("input", el).addEventListener("change", e => { el.classList.toggle("selected", e.target.checked); $("#count").textContent = document.querySelectorAll(".pick input:checked").length; });
    $("#g" + it.g).appendChild(el);
});

$("#copy").addEventListener("click", () => {
    const picked = [...document.querySelectorAll(".pick input:checked")].map(i => "- " + i.value);
    const txt = picked.length ? "Idées boutique choisies :\n" + picked.join("\n") : "Aucune idée choisie";
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {});
    $("#copy").textContent = "✔ Copié ! Colle-le dans le chat";
    setTimeout(() => $("#copy").textContent = "Copier ma sélection", 2500);
});
</script>
</body>
</html>
