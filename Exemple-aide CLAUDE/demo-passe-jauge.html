<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetLab – Passe avec jauge</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0f1117; color: #e6e8ee; font-family: system-ui, "Segoe UI", sans-serif; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 6px; }
.sub { color: #858a98; margin: 0 0 18px; max-width: 900px; font-size: 14px; line-height: 1.5; }
.wrap { max-width: 900px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; margin-bottom: 16px; border-radius: 14px; border: 1px solid #2c3040; background: #151821; }
.tab { border: 1px solid #343846; background: #11131a; color: #aaaeba; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.tab.on { border-color: #6c63ff; background: #2a2850; color: #fff; }
.pick { margin-left: auto; border: none; border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 900; color: white; background: linear-gradient(135deg, #2fb37a, #4fd39a); cursor: pointer; }
.copied { color: #63d69f; font-size: 13px; font-weight: 800; }
.vdesc { width: 100%; color: #858a98; font-size: 13px; }
.sim { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #aaaeba; align-items: center; }
.sim label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.sim button { border: 1px solid #343846; background: #11131a; color: #c9ccd6; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.sim button:hover { border-color: #6c63ff; }

.box { border: 1px solid #2c3040; border-radius: 18px; background: linear-gradient(180deg, #1c202c 0%, #14161e 100%); padding: 20px; display: grid; gap: 16px; overflow: hidden; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.head-info { flex: 1; min-width: 220px; display: grid; gap: 4px; }
.head-info b { font-size: 18px; }
.muted { color: #858a98; font-size: 13px; }
.flame { color: #ffb37a; font-weight: 800; font-size: 13px; }
.claim-all { border: none; border-radius: 14px; padding: 13px 18px; background: #63d69f; color: #062012; font: inherit; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 0 18px rgba(99,214,159,.35); }
.claim-all:disabled { background: #222631; color: #737887; box-shadow: none; cursor: default; }

/* Piste : une colonne par niveau */
.track { overflow-x: auto; padding: 4px 4px 6px; scroll-behavior: smooth; }
.lane { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 100px; width: max-content; }
.cell { padding: 0 5px; }
.rw { position: relative; height: 92px; border-radius: 12px; border: 1px solid #2c3040; background: #181b24; display: grid; place-items: center; align-content: center; gap: 3px; padding: 4px; text-align: center; font-size: 10px; color: #aaaeba; transition: border-color .3s, box-shadow .3s, opacity .3s; }
.rw .ico { font-size: 26px; line-height: 1; }
.rw .ico small { font-size: 13px; vertical-align: top; }
.rw.gold { border-color: #4a3f1c; background: linear-gradient(180deg, #221d10, #181b24); }
.rw.ready { border-color: #63d69f; box-shadow: 0 0 12px rgba(99,214,159,.35); cursor: pointer; padding-bottom: 20px; }
.rw.ready:hover { transform: translateY(-2px); }
.rw.ready::after { content: "Récupérer"; position: absolute; left: -1px; right: -1px; bottom: -1px; padding: 3px 0; border-radius: 0 0 12px 12px; background: #63d69f; color: #062012; font-size: 11px; font-weight: 900; }
.ready-count { padding: 8px 12px; border-radius: 12px; background: rgba(99,214,159,.12); border: 1px solid rgba(99,214,159,.4); color: #63d69f; font-weight: 900; font-size: 14px; }
.rw.done { opacity: .45; }
.rw.locked { opacity: .45; }
.rw.empty { background: transparent; border: 1px dashed rgba(255,255,255,.06); }

/* Fonds des deux rangées */
.band { width: max-content; padding: 10px 0; border-radius: 16px; }
.band-classic { background: linear-gradient(180deg, #232838, #1a1e2b); border: 1px solid #343a52; }
.band-gold { background: linear-gradient(180deg, rgba(255,204,64,.32), rgba(245,180,40,.16)); border: 1px solid rgba(255,204,64,.6); box-shadow: inset 0 0 30px rgba(245,196,81,.08); }
.band-gold .rw.gold { background: linear-gradient(180deg, #3a2f12, #221d10); border-color: #7a6526; color: #e8d39a; }
.band-gold .rw.empty { border-color: rgba(245,196,81,.18); }
.row-label { position: sticky; left: 10px; width: max-content; font-size: 12px; font-weight: 900; color: #c9ccd6; margin: 0 0 8px 10px; }
.row-label.gold { color: #f5c451; margin: 8px 0 0 10px; }
.rw .tag { position: absolute; top: 4px; right: 6px; font-size: 11px; }
.rw.pop { animation: pop .5s ease-out; }
@keyframes pop { 40% { transform: scale(1.08); } }

/* ===== Jauge A : fine, avec points et bulle ===== */
.gauge-a { position: relative; height: 46px; margin: 36px 0 10px; }
.gauge-a .rail { position: absolute; left: 0; right: 0; top: 10px; height: 8px; border-radius: 99px; background: #262a38; }
.gauge-a .fill { position: absolute; left: 0; top: 10px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #6c63ff, #c86bff); box-shadow: 0 0 12px rgba(200,107,255,.5); transition: width 1s ease-out; }
.gauge-a .dot { position: absolute; top: 14px; width: 16px; height: 16px; transform: translate(-50%, -50%); border-radius: 50%; background: #262a38; border: 2px solid #343846; transition: background .3s, border-color .3s; }
.gauge-a .dot.on { background: #c86bff; border-color: #fff; }
.gauge-a .num { position: absolute; top: 28px; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: #737887; }
.gauge-a .num.on { color: #fff; }
.gauge-a .me { position: absolute; top: -26px; transform: translateX(-50%); transition: left 1s ease-out; background: #6c63ff; color: #fff; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; white-space: nowrap; z-index: 2; }
.gauge-a .me::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: #6c63ff; }

/* ===== Jauge B : épaisse, numéros dedans ===== */
.gauge-b { position: relative; height: 30px; margin-top: 10px; border-radius: 99px; background: #262a38; overflow: hidden; }
.gauge-b .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6c63ff, #c86bff); transition: width 1s ease-out; }
.gauge-b .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0, rgba(255,255,255,.25) 50%, transparent 100%); background-size: 120px 100%; animation: shine 2s linear infinite; }
@keyframes shine { from { background-position: -120px 0; } to { background-position: 120px 0; } }
.gauge-b .num { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: 900; color: #737887; z-index: 1; }
.gauge-b .num.on { color: #fff; }
.gauge-b .sep { position: absolute; top: 6px; bottom: 6px; width: 1px; background: rgba(255,255,255,.08); z-index: 1; }
.gauge-b-me { margin-top: 6px; height: 18px; position: relative; }
.gauge-b-me span { position: absolute; transform: translateX(-50%); transition: left 1s ease-out; font-size: 11px; font-weight: 900; color: #c86bff; white-space: nowrap; }

.xp-float { position: fixed; z-index: 9; font-weight: 900; color: #c86bff; font-size: 18px; pointer-events: none; animation: float 1.2s ease-out forwards; }
@keyframes float { to { transform: translateY(-40px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 10; padding: 10px 16px; border-radius: 12px; background: linear-gradient(135deg, #6c63ff, #c86bff); font-weight: 900; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="wrap">
    <h1>Passe : jauge entre classique et Gold</h1>
    <p class="sub">
        Récompenses <b>classiques au-dessus</b> de la jauge, <b>Gold en dessous</b>. La jauge avance avec ton XP,
        les niveaux s'allument quand tu les passes et les récompenses deviennent vertes (à récupérer).
        Clique <b>« + 20 XP (mise) »</b> plusieurs fois pour voir la jauge évoluer.
    </p>

    <div class="controls" id="controls">
        <div class="sim">
            <button data-xp="20">+ 20 XP (mise)</button>
            <button data-xp="30">+ 30 XP (pari gagné)</button>
            <button data-xp="100">+ 100 XP</button>
            <label><input type="checkbox" id="gold"> Simuler le Gold</label>
        </div>
    </div>

    <div class="box">
        <div class="head">
            <div class="head-info" id="info"></div>
            <span id="claim"></span>
        </div>
        <div class="track" id="track"></div>
    </div>
</div>

<script>
const REWARDS = [
    [1,"gold","🔥","Emoji 🔥"],[2,"classique","💰","+200 €"],[3,"gold","🏷️","Titre « Outsider »"],[4,"classique","🍀","Emoji 🍀"],
    [5,"gold","💙","Néon bleu"],[6,"classique","💰","+300 €"],[7,"gold","🥉","Pseudo bronze"],[8,"classique","💰","+300 €"],
    [9,"gold","✨","Étincelles"],[10,"classique","💰","+500 €"],[10,"gold","🃏","Thème Carbone"],[11,"gold","⚡","Emoji ⚡"],
    [12,"classique","🏷️","Titre « Débutant »"],[13,"gold","🦈","Titre « Requin »"],[14,"classique","💰","+400 €"],[15,"gold","💗","Néon rose"],
    [16,"classique","💰","+500 €"],[17,"gold","🥈","Pseudo argent"],[18,"classique","💰","+500 €"],[19,"gold","🦊","Emoji 🦊"],
    [20,"classique","💚","Néon vert"],[20,"gold","🌅","Thème Sunset"],[21,"gold","🌀","Aura"],[22,"classique","💰","+600 €"],
    [23,"gold","🏷️","Titre « Chanceux »"],[24,"classique","💰","+700 €"],[25,"gold","💛","Néon jaune"],[26,"classique","💰","+800 €"],
    [27,"gold","💎","Emoji 💎"],[28,"classique","🌸","Pseudo or rose"],[29,"gold","🥇","Pseudo or"],[30,"classique","💰","+1 000 €"],[30,"gold","🌌","Thème Galaxie"]
].map(([tier, track, icon, label]) => ({ tier, track, icon, label }));

const COL = 100;
const LEVELS = 30;
const S = { xp: 745, gold: false, claimed: new Set(["2classique", "4classique", "6classique"]), streak: 7, v: "A" };

const mult = () => S.streak >= 30 ? 2 : S.streak >= 15 ? 1.75 : S.streak >= 7 ? 1.5 : S.streak >= 3 ? 1.2 : 1;
const level = () => Math.min(LEVELS, Math.floor(S.xp / 100));
const inLevel = () => level() >= LEVELS ? 100 : S.xp % 100;
const key = r => r.tier + r.track;
function state(r) {
    if (r.track === "gold" && !S.gold) return "locked";
    if (S.claimed.has(key(r))) return "done";
    return r.tier <= level() ? "ready" : "";
}
const ready = () => REWARDS.filter(r => state(r) === "ready");

// Position (px) du centre de la colonne d'un niveau, et de l'XP actuelle.
const levelX = n => (n - 0.5) * COL;
const xpX = () => Math.max(0, Math.min(LEVELS * COL, levelX(Math.min(LEVELS, S.xp / 100))));

function cellHtml(n, track) {
    const r = REWARDS.find(x => x.tier === n && x.track === track);
    if (!r) return `<div class="cell"><div class="rw empty"></div></div>`;
    const st = state(r);
    const tag = st === "locked" ? "🔒" : st === "done" ? "✓" : "";
    return `
        <div class="cell">
            <div class="rw ${track === "gold" ? "gold" : ""} ${st}" data-level="${n}" ${st === "ready" ? `onclick="claimOne(${n}, '${track}')"` : ""}>
                <span class="tag">${tag}</span>
                <span class="ico">${r.icon}</span>
                <span>${r.label}</span>
            </div>
        </div>`;
}

function gaugeHtml() {
    const lv = level();
    if (S.v === "A") {
        let dots = "";
        for (let n = 1; n <= LEVELS; n++) {
            dots += `<span class="dot ${n <= lv ? "on" : ""}" style="left:${levelX(n)}px"></span>
                     <span class="num ${n <= lv ? "on" : ""}" style="left:${levelX(n)}px">${n}</span>`;
        }
        return `<div class="gauge-a" style="width:${LEVELS * COL}px">
            <div class="rail"></div>
            <div class="fill" style="width:${xpX()}px"></div>
            ${dots}
            <span class="me" style="left:${xpX()}px">Toi · ${inLevel()}/100 XP</span>
        </div>`;
    }
    let nums = "";
    for (let n = 1; n <= LEVELS; n++) {
        nums += `<span class="num ${n <= lv ? "on" : ""}" style="left:${levelX(n)}px">${n}</span>`;
        if (n < LEVELS) nums += `<span class="sep" style="left:${n * COL}px"></span>`;
    }
    return `<div class="gauge-b" style="width:${LEVELS * COL}px">
            <div class="fill" style="width:${xpX()}px"></div>${nums}
        </div>
        <div class="gauge-b-me" style="width:${LEVELS * COL}px"><span style="left:${xpX()}px">▲ Toi · ${inLevel()}/100 XP</span></div>`;
}

function render(first) {
    document.getElementById("info").innerHTML = `<b>Pass de combat</b>`;
    const n = ready().length;
    document.getElementById("claim").innerHTML = n
        ? `<span class="ready-count">🎁 ${n} récompense${n > 1 ? "s" : ""} à récupérer</span>`
        : "";

    const track = document.getElementById("track");
    const keep = track.scrollLeft;
    let classic = "", gold = "";
    for (let lv = 1; lv <= LEVELS; lv++) { classic += cellHtml(lv, "classique"); gold += cellHtml(lv, "gold"); }
    track.innerHTML = `
        <div class="band band-classic">
            <div class="row-label">Classique</div>
            <div class="lane">${classic}</div>
        </div>
        ${gaugeHtml()}
        <div class="band band-gold">
            <div class="lane">${gold}</div>
            <div class="row-label gold">👑 Gold</div>
        </div>`;
    track.style.scrollBehavior = "auto";
    track.scrollLeft = first ? xpX() - track.clientWidth / 2 : keep;
    track.style.scrollBehavior = "";
}

// La jauge avance en douceur : on redessine sans animation puis on fait glisser.
function addXp(amount, button) {
    const before = level();
    const fromX = xpX();
    const gain = Math.round(amount * mult());
    S.xp += gain;
    const toX = xpX();
    // On repart de l'ancienne position pour animer la jauge.
    const realXp = S.xp; S.xp -= gain; render(); S.xp = realXp;
    requestAnimationFrame(() => requestAnimationFrame(() => {
        document.querySelectorAll(".fill").forEach(f => f.style.width = toX + "px");
        document.querySelectorAll(".me, .gauge-b-me span").forEach(m => m.style.left = toX + "px");
        const track = document.getElementById("track");
        track.scrollLeft = toX - track.clientWidth / 2;
        setTimeout(() => {
            render();
            if (level() > before) {
                document.querySelectorAll(`.rw[data-level]`).forEach(c => { if (+c.dataset.level > before && +c.dataset.level <= level()) c.classList.add("pop"); });
                toast(`⭐ Niveau ${level()} !`);
            }
        }, 1000);
    }));
    const r = button.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "xp-float";
    f.textContent = "+" + gain + " XP" + (mult() > 1 ? " (🔥×" + mult().toLocaleString("fr-FR") + ")" : "");
    f.style.left = r.left + "px"; f.style.top = (r.top - 10) + "px";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1200);
}
function claimOne(n, track) {
    const r = REWARDS.find(x => x.tier === n && x.track === track);
    S.claimed.add(key(r));
    render();
    toast(`${r.icon} ${r.label} récupéré !`);
}
function toast(t) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = t;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
}

const DESC = {
    A: "Une jauge fine sous les récompenses, un point par niveau qui s'allume, et une bulle « Toi » qui avance avec ton XP.",
    B: "Une jauge épaisse et brillante, les numéros des niveaux écrits dedans, et un petit repère « Toi » dessous."
};
const box = document.getElementById("controls");
box.querySelectorAll("[data-xp]").forEach(b => b.onclick = () => addXp(+b.dataset.xp, b));
document.getElementById("gold").onchange = e => { S.gold = e.target.checked; render(); };
render(true);
</script>
</body>
</html>
