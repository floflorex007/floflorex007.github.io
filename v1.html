<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetLab</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    /* La V0 est fermée (2026-10-30) : index.html et app.html renvoient ici.
       Grand écran : même présentation que la V1 (DesktopPage). Téléphone : un bouton vers la V1. */
    :root {
        --bl-bg: #0d1219; --bl-text: #eef3f9; --bl-muted: #8794a8; --bl-border: rgba(255, 255, 255, .08);
        --bl-pill: rgba(22, 29, 39, .95); --bl-ara: linear-gradient(90deg, #2f86e8, #2fbf71, #ffc21a);
        --bl-grad: linear-gradient(120deg, #2f7fe8 0%, #1aa5d4 50%, #22bf8e 100%);
        --bl-odds-grad: linear-gradient(120deg, #f2992a 0%, #e8672c 50%, #dc4a5a 100%); --bl-odds-edge: #7a2a1c;
        --bl-bet-card: radial-gradient(110% 70% at 0% 0%, rgba(47, 134, 232, .38), transparent 60%), linear-gradient(180deg, #1c2533, #121821);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bl-bg); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

.dk {
    position: fixed;
    inset: 0;
    overflow: auto;
    background:
        radial-gradient(60% 60% at 8% 0%, rgba(31, 122, 224, .34), transparent 62%),
        radial-gradient(50% 50% at 60% 0%, rgba(47, 191, 113, .12), transparent 65%),
        radial-gradient(55% 60% at 100% 12%, rgba(255, 194, 26, .16), transparent 60%),
        var(--bl-bg);
    color: var(--bl-text);
}

.dk-in {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 40px;
    align-items: center;
    max-width: 1180px;
    min-height: 100%;
    margin: 0 auto;
    padding: 32px clamp(32px, 6vw, 86px);
}

.dk-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .08em;
}

.dk-brand img { width: 48px; }

.dk-badge {
    display: inline-flex;
    margin-top: 30px;
    padding: 7px 14px;
    border: 1px solid rgba(74, 163, 255, .5);
    border-radius: 999px;
    background: rgba(47, 134, 232, .13);
    color: #8fc6ff;
    font-size: 14px;
    font-weight: 800;
}

.dk h1 {
    margin: 16px 0 0;
    font-size: clamp(40px, 4.6vw, 58px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -.03em;
}

.dk h1 em {
    background: var(--bl-ara);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-style: normal;
}

.dk p {
    max-width: 460px;
    margin: 16px 0 0;
    color: #9eaabd;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
}

/* QR code : cadre ara et perroquet au centre, comme le QR d'invitation */
.dk-qr {
    display: flex;
    align-items: center;
    gap: 20px;
    width: fit-content;
    margin-top: 30px;
    padding: 16px 22px 16px 16px;
    border-radius: 26px;
    background: linear-gradient(180deg, #1f2a3a, #141b25);
    box-shadow: 0 0 0 1px var(--bl-border), 0 18px 40px rgba(0, 0, 0, .4);
}

.dk-qr b {
    display: block;
    font-size: 18px;
    font-weight: 800;
}

.dk-qr small {
    display: block;
    margin-top: 5px;
    color: var(--bl-muted);
    font-size: 13.5px;
    line-height: 1.4;
}

.dk-qr-frame {
    position: relative;
    flex: none;
    padding: 4px;
    border-radius: 18px;
    background: var(--bl-ara);
    box-shadow: 0 0 34px rgba(47, 134, 232, .42);
    animation: dk-halo 3s ease-in-out infinite;
}

@keyframes dk-halo { 50% { box-shadow: 0 0 54px rgba(47, 191, 113, .5); } }

.dk-qr-in {
    width: 172px;
    height: 172px;
    padding: 8px;
    border-radius: 15px;
    background: #fff;
}

.dk-qr-in img {
    display: block;
    width: 100%;
    height: 100%;
}

.dk-qr-logo {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    padding: 3px;
    border-radius: 12px;
    background: #fff;
    translate: -50% -50%;
}

.dk-qr-logo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.dk-legal {
    display: inline-block;
    margin-top: 22px;
    color: var(--bl-muted);
    font-size: 13px;
}

/* Le mur dans un téléphone */
.dk-phone {
    flex: none;
    width: 306px;
    height: 640px;
    padding: 8px;
    border-radius: 46px;
    background: #1d2029;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 34px 80px rgba(0, 0, 0, .65);
}

.dk-screen {
    position: relative;
    height: 100%;
    overflow: hidden;
    padding: 0 11px;
    border-radius: 38px;
    background:
        radial-gradient(85% 45% at 0% 0%, rgba(31, 122, 224, .36), transparent 62%),
        radial-gradient(70% 40% at 100% 8%, rgba(255, 194, 26, .2), transparent 60%),
        var(--bl-bg);
}

.dk-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 28px 1px 8px;
}

.dk-av {
    position: relative;
    flex: none;
    width: 36px;
    height: 36px;
    padding: 2px;
    border-radius: 50%;
    background: conic-gradient(#5a7bff 0, #a96bff 35%, #e08bff 70%, rgba(255, 255, 255, .1) 70% 100%);
}

.dk-av span {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bl-bg);
    font-size: 13px;
    font-weight: 800;
}

.dk-av b {
    position: absolute;
    right: -3px;
    bottom: -2px;
    min-width: 15px;
    height: 15px;
    display: grid;
    place-items: center;
    border: 2px solid var(--bl-bg);
    border-radius: 8px;
    background: linear-gradient(135deg, #c79bff, #8a55f0);
    font-size: 8.5px;
}

.dk-group {
    flex: 1;
    min-width: 0;
    padding-left: 4px;
    font-size: 13.5px;
    font-weight: 800;
    white-space: nowrap;
}

.dk-bal {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 999px;
    background: var(--bl-pill);
    font-size: 12.5px;
    font-weight: 800;
}

.dk-bal svg { width: 18px; height: 12px; }

.dk-filters {
    display: flex;
    gap: 5px;
    padding: 2px 1px 8px;
}

.dk-filters span {
    padding: 5px 9px;
    border: 1px solid rgba(74, 163, 255, .5);
    border-radius: 999px;
    color: #8fc6ff;
    font-size: 10.5px;
    font-weight: 700;
}

.dk-card {
    margin-bottom: 11px;
    padding: 13px 12px 12px;
    border-radius: 24px;
    background: var(--bl-bet-card);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 5px 0 rgba(0, 0, 0, .45), 0 12px 24px rgba(0, 0, 0, .35);
    text-align: center;
}

.dk-card h4 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.3;
}

.dk-when {
    display: inline-block;
    margin-bottom: 9px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    color: var(--bl-muted);
    font-size: 10px;
    font-weight: 700;
}

.dk-odds {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.dk-odds span {
    padding: 7px 4px;
    border-radius: 13px;
    background: var(--bl-odds-grad);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 0 var(--bl-odds-edge);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
}

.dk-odds b {
    display: block;
    font-size: 14px;
    font-weight: 900;
}

.dk-nav {
    position: absolute;
    left: 9px;
    right: 9px;
    bottom: 10px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    height: 52px;
    border: 1px solid var(--bl-border);
    border-radius: 20px;
    background: rgba(22, 29, 39, .92);
    font-size: 16px;
    text-align: center;
}

.dk-nav .plus {
    justify-self: center;
    width: 42px;
    height: 42px;
    margin-top: -20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--bl-grad);
    box-shadow: 0 6px 18px rgba(30, 150, 220, .42);
    color: #fff;
    font-size: 26px;
}

.dk-nav img {
    justify-self: center;
    width: 46px;
    margin-top: -20px;
}

    /* Bouton vers la V1 (téléphone) */
    .dk-go {
        display: none;
        margin-top: 28px;
        padding: 17px 22px;
        border-radius: 999px;
        background: var(--bl-grad);
        box-shadow: 0 8px 26px rgba(30, 150, 220, .42);
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
    }

    /* Téléphone : pas de QR code ni de téléphone dans le téléphone */
    @media not all and (min-width: 900px) and (min-height: 600px) {
        .dk-in { grid-template-columns: minmax(0, 1fr); padding: 32px 22px; }
        .dk-phone, .dk-qr { display: none; }
        .dk-go { display: block; }
        .dk h1 { font-size: 38px; }
        .dk p { font-size: 16.5px; }
    }
</style>
</head>
<body>
<main class="dk">
    <div class="dk-in">
        <div class="dk-text">
            <div class="dk-brand"><img src="assets/perroquet-assis-hd.png" alt="">BETLAB</div>
            <span class="dk-badge">📱 App mobile</span>
            <h1>Parie avec tes potes<br><em>sans argent réel.</em></h1>
            <p>Crée un groupe, lance des paris sur tout et n'importe quoi, et grimpe au classement.</p>
            <a class="dk-go" href="https://betlab.pages.dev/">Aller sur la V1 de BetLab</a>
            <div class="dk-qr">
                <div class="dk-qr-frame">
                    <div class="dk-qr-in"><img src="assets/qr-v1.png" alt="QR code pour ouvrir BetLab sur ton téléphone"></div>
                    <span class="dk-qr-logo"><img src="assets/perroquet-assis-hd.png" alt=""></span>
                </div>
                <div>
                    <b>Scanne avec ton téléphone</b>
                    <small>BetLab se joue uniquement<br>sur téléphone</small>
                </div>
            </div>
        </div>

        <div class="dk-phone" aria-hidden="true">
            <div class="dk-screen">
                <div class="dk-top">
                    <span class="dk-av"><span>F</span><b>3</b></span>
                    <span class="dk-group">Les Fous du BE ▾</span>
                    <span class="dk-bal">1 240 💵</span>
                </div>
                <div class="dk-filters"><span>Non misé</span><span>Misé</span><span>Clos</span></div>
                <div id="wall"></div>
                <div class="dk-nav">
                    <span>🎲</span><span>📜</span><span class="plus">+</span><span>🏆</span><img src="assets/perroquet-assis-hd.png" alt="">
                </div>
            </div>
        </div>
    </div>
</main>
<script>
    // Cartes inventées, tirées au hasard, comme la page de la V1.
    const SAMPLE_BETS = [
        ['Kevin arrive en retard demain ?', 'Demain 9:00', 'Oui', '2,4', 'Non', '1,6'],
        ['Julie gagne le baby de midi ?', '-3h', 'Oui', '1,8', 'Non', '2,1'],
        ['Il pleut à la pause de 16 h ?', '15:30', 'Oui', '3,2', 'Non', '1,3'],
        ['Marc oublie son badge lundi ?', 'lun. 3', 'Oui', '2,0', 'Non', '1,9'],
        ['La réunion dure plus d\'une heure ?', '14:00', 'Oui', '1,5', 'Non', '2,6'],
        ['Qui ramène les croissants vendredi ?', 'ven. 7', 'Sophie', '1,7', 'Thomas', '2,3'],
        ['La machine à café tombe en panne ?', 'sam. 8', 'Oui', '4,5', 'Non', '1,2'],
        ['Plus de 3 buts au match de ce soir ?', '20:45', 'Plus', '2,2', 'Moins', '1,7']
    ];
    document.getElementById('wall').innerHTML = SAMPLE_BETS.sort(() => Math.random() - .5).slice(0, 4).map(b =>
        `<div class="dk-card"><h4>${b[0]}</h4><span class="dk-when">🕒 ${b[1]}</span><div class="dk-odds"><span>${b[2]}<b>${b[3]}</b></span><span>${b[4]}<b>${b[5]}</b></span></div></div>`
    ).join('');
</script>
</body>
</html>
